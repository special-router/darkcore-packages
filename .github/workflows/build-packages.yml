name: Build DarkCore Packages

on:
  workflow_dispatch:

env:
  ARTIFACT_DIR: "artifacts"
  BUILD_DATE: ""
  # OpenWrt SDK for the target these packages ship to.
  SDK_FILE: "openwrt-sdk-24.10.4-rockchip-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
  SDK_URL_BASE: "https://downloads.openwrt.org/releases/24.10.4/targets/rockchip/armv8"
  PKGS: "geoupdate darkcore-xray darkcore-main dcvpnupd"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build env on ubuntu
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            python3-pyelftools libelf-dev rsync swig unzip zlib1g-dev file wget \
            zstd time pkg-config subversion xmlto uuid-dev libglib2.0-dev

      # The SDK tarball never changes for a given SDK_FILE, so a static key
      # means it is downloaded at most once ever.
      - name: Cache OpenWrt SDK tarball
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_FILE }}
          key: sdk-${{ env.SDK_FILE }}

      - name: Download OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          # downloads.openwrt.org is the round-robin CDN, not a single mirror.
          wget --tries=5 --retry-connrefused --waitretry=15 --timeout=30 \
            -O "${SDK_FILE}" "${SDK_URL_BASE}/${SDK_FILE}"

      - name: Extract SDK
        run: |
          tar xf "${SDK_FILE}"
          # trailing slash: match only the extracted dir, not the (cached)
          # tarball sitting next to it.
          mv openwrt-sdk-*/ openwrt-sdk

      # dl/ holds the xray-core source tarball and the Go module cache
      # (GO_MOD_CACHE_DIR = dl/go-mod-cache); go-build/ is the Go build cache.
      # Without this, darkcore-xray recompiles all of xray-core every run.
      - name: Cache build downloads and Go cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt-sdk/dl
            openwrt-sdk/tmp/go-build
          key: builddl-${{ env.SDK_FILE }}-${{ hashFiles('*/Makefile', '*/src/go.mod', '*/src/go.sum') }}
          restore-keys: |
            builddl-${{ env.SDK_FILE }}-

      - name: Copy packages into SDK
        run: |
          for p in ${PKGS}; do
            cp -r "$p" "openwrt-sdk/package/$p"
          done

      - name: Install feeds
        run: |
          cd openwrt-sdk
          # Only the packages feed is needed (golang/host, Go runtime deps);
          # ca-bundle is a core package. Skips the slow, flaky clones of
          # luci/routing/telephony from git.openwrt.org.
          ./scripts/feeds update packages
          ./scripts/feeds install -a -p packages
          make defconfig

      - name: Build packages
        run: |
          cd openwrt-sdk
          for p in ${PKGS}; do
            make -j"$(nproc)" "package/$p/compile" V=s
          done

      - name: Collect IPKs
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          ls -laR openwrt-sdk/bin/packages || true
          for p in ${PKGS}; do
            cp -p openwrt-sdk/bin/packages/*/base/${p}_*.ipk "${ARTIFACT_DIR}/"
          done
          ls -l "${ARTIFACT_DIR}"

      - name: Upload IPKs
        uses: actions/upload-artifact@v4
        with:
          name: darkcore-ipks
          path: ${{ env.ARTIFACT_DIR }}/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare workspace
        run: |
          mkdir -p ${{ env.ARTIFACT_DIR }}
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.ARTIFACT_DIR }}
          merge-multiple: true

      - name: Install tooling
        run: |
          sudo apt-get update
          # signify-openbsd uses the same key/signature format as OpenWrt's
          # usign, so it verifies the feed the same way - and it drops a
          # flaky git clone + cmake build of usign.
          sudo apt-get install -y --no-install-recommends signify-openbsd
          # opkg-utils: prefer the distro package; fall back to upstream.
          sudo apt-get install -y --no-install-recommends opkg-utils || true
          if ! command -v opkg-make-index >/dev/null; then
            git clone --depth 1 https://git.yoctoproject.org/opkg-utils
            echo "$PWD/opkg-utils" >> "$GITHUB_PATH"
          fi

      - name: Checkout feed branch
        uses: actions/checkout@v4
        with:
          ref: feed
          path: feed

      - name: Restore usign private key
        env:
          USIGN_SECRET_KEY_B64: ${{ secrets.USIGN_SECRET_KEY_B64 }}
        shell: bash
        run: |
          echo "$USIGN_SECRET_KEY_B64" | base64 -d > key-build.sec
          chmod 600 key-build.sec

      - name: Prepare feed files
        run: |
          rm -rf feed/*.ipk feed/Packages*
          cp -p ${{ env.ARTIFACT_DIR }}/*.ipk feed

          n=0
          until opkg-make-index -a -f -v --checksum sha256 feed > feed/Packages || [ $n -ge 3 ]; do
            echo "Indexing failed, retrying... ($((++n)))"
            sleep 2
          done

          gzip -kf feed/Packages > feed/Packages.gz

          file feed/Packages
          file key-build.sec

          signify-openbsd -S -m feed/Packages -s key-build.sec -x feed/Packages.sig

          ls -l feed/

          generate_tbody() {
            echo "          <tbody>"
            for file in feed/Packages* feed/*.ipk; do
              [ -f "${file}" ] || continue
              fname=$(basename "${file}")
              fsize=$(du -h "${file}" | cut -f1)
              fdate=$(date -r "${file}" +"%Y-%m-%d %a %H:%M:%S UTC")
              echo "                        <tr>"
              echo "                            <td><a href=\"$fname\">$fname</a></td>"
              echo "                            <td>$fsize</td>"
              echo "                            <td>$fdate</td>"
              echo "                        </tr>"
            done
            echo "          </tbody>"
          }

          generate_tbody > feed/tbody.tmp

          sed -i '/<!-- tbody-anchor -->/,/<!-- end-tbody-anchor -->/ {
            /<!-- tbody-anchor -->/!{
              /<!-- end-tbody-anchor -->/!d
            }
          }' feed/index.html
          sed -i '/<!-- tbody-anchor -->/r feed/tbody.tmp' feed/index.html
          rm -f feed/tbody.tmp

          current_date="${{ env.BUILD_DATE }}"
          sed -i '/<!-- date-anchor -->/,/<!-- end-date-anchor -->/ {
              /<span id="date">/ {
                  s#<span id="date">.*</span>#<span id="date">'"${current_date}"'</span>#
              }
          }' feed/index.html

      - name: Commit and push to feed branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update feed: ${{ env.BUILD_DATE }}"
          git push origin HEAD:feed
        working-directory: feed
