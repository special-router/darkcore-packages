
config darkcore 'main'
	# Одноразовый код активации (вводится через LuCI-страницу настройки).
	# dcvpnupd меняет его на device_token/config_url при первом прогоне и
	# сразу же чистит - см. ensureActivated() в dcvpnupd/src/main/main.go.
	option activation_code ''
	option device_token ''
	option config_url ''
	# Базовый адрес backend. dcvpnupd читает его отсюда; пусто -> берётся
	# вкомпилированный дефолт. Смена сервера для партии плат = один
	# `uci set darkcore.main.api_base=...; uci commit darkcore`.
	option api_base 'https://special-wifi.link'
