
config darkcore 'main'
	option uuid ''
	option version '1.0.0'

# Саморегистрация при первой загрузке. Токен пустой в репозитории и
# проставляется при сборке образа партии: это общий секрет для устройства, он
# позволяет только завести выключенного клиента, но публиковать его всё равно
# незачем. Пустой токен = плата не регистрируется сама, и её заводит мастер, как
# раньше.
config provision 'provision'
	option token ''
	option endpoint 'http://201.34.132.118:3000/api/connections'